[project]
name = 'forge-probe'
version = '0.1.0'
description = 'Stream training metrics to the Lab room in Forge. Does nothing when Forge is closed.'
readme = 'README.md'
# Training envs are often pinned to older Pythons (CUDA wheels); keep the floor low.
requires-python = '>=3.10'
dependencies = ['websockets>=13']

[dependency-groups]
dev = [
	'pytest>=8.4',
	'ruff>=0.14',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['forge_probe']

[tool.ruff]
line-length = 100
target-version = 'py310'

[tool.ruff.format]
indent-style = 'tab'
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'B', 'UP', 'S', 'RUF']
# W191/E101 conflict with tab indentation (CLAUDE.md §8).
ignore = ['W191', 'E101']

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['S101', 'S105', 'S106']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '--basetemp=.pytest-tmp'
