name: CI

on:
  push:
    branches: [main, 'phase-*/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (TypeScript)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  sidecar:
    name: Sidecar (Python)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  probe:
    name: forge-probe + examples (Python)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/forge-probe
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: packages/forge-probe/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check . ../../examples

      - name: Ruff format check
        run: uv run ruff format --check . ../../examples

      - name: Tests
        run: uv run pytest -q
