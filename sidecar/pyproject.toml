[project]
name = 'forge-sidecar'
version = '0.1.0'
description = 'Local Python sidecar for Forge (market data, ML, MT5, data tooling).'
requires-python = '>=3.12,<3.13'
dependencies = [
	'fastapi>=0.120',
	'uvicorn>=0.38',
	'pydantic>=2.12',
	'httpx>=0.28',
]

[dependency-groups]
dev = [
	'pytest>=8.4',
	'ruff>=0.14',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['forge_sidecar']

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.format]
indent-style = 'tab'
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'B', 'UP', 'ASYNC', 'S', 'RUF']
# W191/E101 conflict with tab indentation (CLAUDE.md §8). S101: asserts are fine in tests.
ignore = ['W191', 'E101']

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['S101', 'S105', 'S106']

[tool.pytest.ini_options]
testpaths = ['tests']
